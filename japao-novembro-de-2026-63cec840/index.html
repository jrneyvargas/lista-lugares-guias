", "dicas": "", "endereco": "B3F, Shibuya 2, Shibuya, 150-0002", "observacoes": "A gente foi no Umeda Sky, no Prédio do Governo de Tóquio e no Shibuya Hikarie. Tentamos o\nShibuya Sky, que muita gente diz ser o melhor, mas o dia estava nublado e deixaram a gente\npedir reembolso. Se o tempo fechar, pergunta na bilheteria antes de subir.\nO Shibuya Sky e o Tokyo Skytree são os mais famosos e também os mais caros. O Shibuya\nSky passa de R$ 110 no horário do pôr do sol e esgota rápido. O Skytree é o mais alto e muda\nde preço conforme o dia.\nNo custo-benefício, o Prédio do Governo de Tóquio ganha fácil, porque é de graça e a vista de\nShinjuku é linda. O Hikarie também é grátis e fica colado na estação de Shibuya, dá pra passar\nno caminho. Em Osaka, o Umeda Sky custa uns R$ 66, sai de graça até as 15h com o Osaka\nAmazing Pass. A gente foi no fim da tarde e ficou até escurecer.\nSe for escolher só um pago em Tóquio, vai de Shibuya Sky num dia de céu limpo. Pra\neconomizar, faz o Tocho e o Hikarie, que não custam nada.", "extras": {}, "regras_horario": [], "foto_pos": null, "fotos": [], "criado_em": "2026-10-31T21:21:17.645178Z", "atualizado_em": "2026-10-31T21:21:17.645999Z"}, {"id": 41, "titulo": "SHIBUYA HIKARIE", "descricao": "GRATIS, NO 11º DO HIKARIE, COLADO NA ESTAÇÃO DE SHIBUYA", "pais": "jp", "cidade": "Tokyo", "cidade_id": 3, "tipo": "atrativo", "lat": 35.6591803, "lng": 139.7036853, "fonte_texto": "teste japao · pág. 15", "fonte_url": "https://www.instagram.com/p/DeKXIZpGvqU/?img_index=1", "dicas": "", "endereco": "Miyamasu-zaka Street, Shibuya 2, Shibuya, 150-0002", "observacoes": "", "extras": {}, "regras_horario": [], "foto_pos": null, "fotos": [], "criado_em": "2026-10-31T21:21:17.652733Z", "atualizado_em": "2026-10-31T21:21:17.653613Z"}, {"id": 42, "titulo": "TOKYO SKY TREE", "descricao": "COMPRAR ONLINE 1800 A 3600", "pais": "jp", "cidade": "Tokyo", "cidade_id": 3, "tipo": "atrativo", "lat": 35.7097409, "lng": 139.8103773, "fonte_texto": "teste japao
